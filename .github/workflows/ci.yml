name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Run core tests
      run: |
        uv run pytest tests/test_state.py tests/test_routing.py -v --tb=short
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-dummy-key-for-ci' }}
        OPENAI_BASE_URL: "https://aikeys.maibornwolff.de/"
    
    - name: Check imports
      run: |
        uv run python -c "from app.main import app; print('✅ Backend imports OK')"
    
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: front_end/package-lock.json
    
    - name: Install dependencies
      working-directory: ./front_end
      run: npm ci
    
    - name: Run ESLint
      working-directory: ./front_end
      run: npm run lint
    
    - name: Build frontend
      working-directory: ./front_end
      run: npm run build
    
    - name: Check build output
      working-directory: ./front_end
      run: |
        if [ -d "dist" ]; then
          echo "✅ Frontend build successful"
          ls -lh dist/
        else
          echo "❌ Build failed - no dist directory"
          exit 1
        fi
